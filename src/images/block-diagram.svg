<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">PICAXE temp / humidity block diagram</title>
  <desc id="desc">Horizontal flow: 3xAA, rocker, PICAXE board, shared I2C to LCD and AM2320.</desc>
  <rect width="960" height="280" fill="#fafaf8"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="56" width="100" height="88" rx="10" fill="#eef4f6" stroke="#0b6f88" stroke-width="2"/>
    <text x="74" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3844">3xAA</text>
    <text x="74" y="116" text-anchor="middle" font-size="12" fill="#3a5560">~4.5 V</text>
    <path d="M124 100 H150" stroke="#0b6f88" stroke-width="2.5" fill="none"/>
    <polygon points="150,94 164,100 150,106" fill="#0b6f88"/>
    <rect x="170" y="56" width="110" height="88" rx="10" fill="#eef4f6" stroke="#0b6f88" stroke-width="2"/>
    <text x="225" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3844">Rocker</text>
    <text x="225" y="116" text-anchor="middle" font-size="12" fill="#3a5560">V+ only</text>
    <path d="M280 100 H306" stroke="#0b6f88" stroke-width="2.5" fill="none"/>
    <polygon points="306,94 320,100 306,106" fill="#0b6f88"/>
    <text x="288" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#b33">V+</text>
    <rect x="326" y="40" width="200" height="120" rx="12" fill="#d4eef4" stroke="#0b6f88" stroke-width="2.5"/>
    <text x="426" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3844">PICAXE board</text>
    <text x="426" y="100" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#085568">08M2+</text>
    <text x="426" y="122" text-anchor="middle" font-size="12" fill="#3a5560">I2C master</text>
    <text x="426" y="142" text-anchor="middle" font-size="11" fill="#3a5560">connectors</text>
    <path d="M74 144 V168 H426 V160" stroke="#085568" stroke-width="2" fill="none"/>
    <text x="200" y="162" font-family="ui-monospace, monospace" font-size="11" fill="#085568">GND</text>
    <path d="M526 100 H560" stroke="#0b6f88" stroke-width="2.5" fill="none"/>
    <line x1="560" y1="64" x2="560" y2="196" stroke="#0b6f88" stroke-width="2.5"/>
    <text x="548" y="52" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0b6f88">I2C</text>
    <path d="M560 80 H596" stroke="#0b6f88" stroke-width="2.5" fill="none"/>
    <polygon points="596,74 610,80 596,86" fill="#0b6f88"/>
    <rect x="616" y="36" width="320" height="72" rx="10" fill="#eef4f6" stroke="#0b6f88" stroke-width="2"/>
    <text x="776" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3844">1602 LCD + PCF8574 backpack</text>
    <text x="776" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#085568">GND / VCC / SDA / SCL</text>
    <path d="M560 180 H596" stroke="#0b6f88" stroke-width="2.5" fill="none"/>
    <polygon points="596,174 610,180 596,186" fill="#0b6f88"/>
    <rect x="616" y="148" width="320" height="72" rx="10" fill="#eef4f6" stroke="#0b6f88" stroke-width="2"/>
    <text x="776" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3844">AM2320 temp / humidity</text>
    <text x="776" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#085568">VDD / SDA / GND / SCL  (check silk)</text>
  </g>
  <rect x="24" y="236" width="912" height="28" rx="6" fill="#ffffff" stroke="#c5d4d8" stroke-width="1"/>
  <text x="480" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3a5560">Acrylic front: LCD, battery, rocker  |  back: board + sensor  |  looms on pin connectors</text>
</svg>
